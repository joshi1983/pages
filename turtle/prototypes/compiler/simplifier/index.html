<html>
	<head>
		<title>Simplifier Prototype</title>
		<base href="../../../">
		<link rel="stylesheet" type="text/css" href="./prototypes/css/code-editor-generic.css">
		<link rel="stylesheet" type="text/css" href="./prototypes/compiler/to-js/style.css">
		<script type="module" src="./prototypes/compiler/simplifier/simplifier.js"></script>
	</head>
	<body>
		<p>This is a prototype for interactive testing of code that simplifies WebLogo code.
		The corresponding code under test is mostly in 
		modules/components/code-editor/code-fixer/fixers/helpers/simplifiers 
		directory.
		</p>
		<div class="split">
			<div id="code-input-container">
				<div class="scrollable-content">
					<div class="content-container">
						<div id="code-input-line-numbers"></div>
						<div>
							<textarea id="input">print ln exp :x</textarea>
						</div>
					</div>
				</div>
			</div>
			<div><output id="simplified-output"></div>
		</div>
	</body>
</html>
